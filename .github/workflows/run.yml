name: Run ParsingTest every two weeks

on:
  push:
  schedule:
    - cron: '0 12 * * 1/14'  # Запуск каждые две недели по понедельникам в 12:00 UTC

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: 23
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      - name: Create secrets.txt
        run: |
          echo "login=${{ secrets.LOGIN }}" > secrets.txt
          echo "password=${{ secrets.PASSWORD }}" >> secrets.txt

      - name: Print current directory
        run: pwd

      - name: Build project
        run: |
          cd SpotifyExchangeRegion
          mvn clean install

      - name: Run ParsingTest
        run: |
          cd SpotifyExchangeRegion
          xvfb-run --auto-servernum mvn -e -X test
